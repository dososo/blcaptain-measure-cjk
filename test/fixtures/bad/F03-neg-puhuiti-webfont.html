<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>规则夹具</title>
<style>
:where(:root:lang(zh)) { line-break: strict; }
:where(:lang(zh)) { font-synthesis-style: none; text-emphasis-position: under right; }
:where(:lang(zh)) :where(p, li) { line-height: 1.75; }
.measure-prose { max-width: 36em; }
@supports (text-autospace: normal) { :where(:lang(zh)) { text-autospace: normal; } }
body { font-family: "Inter", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 16px; }
@font-face { font-family: "Alibaba PuHuiTi"; src: url("fonts/AlibabaPuHuiTi-3-55-Regular.woff2") format("woff2"); }
h1 { font-family: "Alibaba PuHuiTi", "PingFang SC", sans-serif; }
</style>
</head>
<body>
<main class="measure-prose">
<h1>分寸夹具</h1>
<p>这是一段用于测试的正文，包含 English 单词和数字 2026，用来检查中文排版规则。</p>
</main>
</body>
</html>

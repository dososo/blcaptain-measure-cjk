<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活动报名</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <section id="formView">
      <h1>活动报名</h1>
      <p class="subtitle">请填写以下信息完成报名，带 <span class="req">*</span> 为必填项。</p>

      <form id="signupForm" novalidate>
        <div class="field" data-field="name">
          <label for="name">姓名<span class="req">*</span></label>
          <input type="text" id="name" name="name" maxlength="20" placeholder="请输入真实姓名" autocomplete="name">
          <p class="error"></p>
        </div>

        <div class="field" data-field="phone">
          <label for="phone">手机号<span class="req">*</span></label>
          <input type="tel" id="phone" name="phone" maxlength="11" inputmode="numeric" placeholder="11 位手机号码" autocomplete="tel">
          <p class="error"></p>
        </div>

        <div class="field" data-field="city">
          <label for="city">所在城市<span class="req">*</span></label>
          <select id="city" name="city">
            <option value="">请选择城市</option>
            <option>北京</option>
            <option>上海</option>
            <option>广州</option>
            <option>深圳</option>
            <option>杭州</option>
            <option>成都</option>
            <option>武汉</option>
            <option>南京</option>
            <option>西安</option>
            <option value="其他">其他</option>
          </select>
          <input type="text" id="cityOther" name="cityOther" placeholder="请输入所在城市" maxlength="20" style="margin-top:.5rem" hidden>
          <p class="error"></p>
        </div>

        <fieldset class="field" data-field="session">
          <legend>参加场次<span class="req">*</span></legend>
          <div class="sessions">
            <label class="session">
              <input type="radio" name="session" value="第一场：11月8日（周六）上午 09:30–12:00">
              <div><strong>第一场</strong><span>11月8日（周六）上午 09:30–12:00</span></div>
            </label>
            <label class="session">
              <input type="radio" name="session" value="第二场：11月8日（周六）下午 14:00–17:00">
              <div><strong>第二场</strong><span>11月8日（周六）下午 14:00–17:00</span></div>
            </label>
            <label class="session">
              <input type="radio" name="session" value="第三场：11月9日（周日）下午 14:00–17:00">
              <div><strong>第三场</strong><span>11月9日（周日）下午 14:00–17:00</span></div>
            </label>
          </div>
          <p class="error"></p>
        </fieldset>

        <button type="submit">提交报名</button>
      </form>
    </section>

    <section id="resultView" class="result" hidden>
      <div class="icon">✓</div>
      <h1>报名成功</h1>
      <p class="subtitle">感谢报名，我们会在活动前通过短信与您确认。</p>
      <dl id="summary"></dl>
      <button type="button" id="again">再报名一位</button>
    </section>
  </main>

  <script>
    const form = document.getElementById('signupForm');
    const nameInput = document.getElementById('name');
    const phoneInput = document.getElementById('phone');
    const citySelect = document.getElementById('city');
    const cityOther = document.getElementById('cityOther');

    citySelect.addEventListener('change', () => {
      cityOther.hidden = citySelect.value !== '其他';
      if (!cityOther.hidden) cityOther.focus();
    });

    function setError(field, msg) {
      const box = form.querySelector(`[data-field="${field}"]`);
      box.classList.toggle('invalid', !!msg);
      box.querySelector('.error').textContent = msg || '';
    }

    function validate() {
      const data = {
        name: nameInput.value.trim(),
        phone: phoneInput.value.trim(),
        city: citySelect.value === '其他' ? cityOther.value.trim() : citySelect.value,
        session: (form.querySelector('input[name="session"]:checked') || {}).value || ''
      };
      const errors = {
        name: !data.name ? '请输入姓名' : data.name.length < 2 ? '姓名至少 2 个字' : '',
        phone: !data.phone ? '请输入手机号' : !/^1[3-9]\d{9}$/.test(data.phone) ? '请输入正确的 11 位手机号' : '',
        city: !data.city ? '请选择或填写所在城市' : '',
        session: !data.session ? '请选择参加场次' : ''
      };
      Object.entries(errors).forEach(([k, v]) => setError(k, v));
      const firstBad = Object.keys(errors).find(k => errors[k]);
      return { ok: !firstBad, data, firstBad };
    }

    // 输入时清除对应错误
    form.addEventListener('input', e => {
      const box = e.target.closest('[data-field]');
      if (box) setError(box.dataset.field, '');
    });
    phoneInput.addEventListener('input', () => {
      phoneInput.value = phoneInput.value.replace(/\D/g, '');
    });

    form.addEventListener('submit', e => {
      e.preventDefault();
      const { ok, data, firstBad } = validate();
      if (!ok) {
        const el = form.querySelector(`[data-field="${firstBad}"] input, [data-field="${firstBad}"] select`);
        el && el.focus();
        return;
      }
      const rows = [['姓名', data.name], ['手机号', data.phone], ['所在城市', data.city], ['参加场次', data.session]];
      const dl = document.getElementById('summary');
      dl.replaceChildren(...rows.flatMap(([k, v]) => {
        const dt = document.createElement('dt'); dt.textContent = k;
        const dd = document.createElement('dd'); dd.textContent = v;
        return [dt, dd];
      }));
      // 如需对接后端，可在此处用 fetch 提交 data
      console.log('报名数据：', data);
      document.getElementById('formView').hidden = true;
      document.getElementById('resultView').hidden = false;
    });

    document.getElementById('again').addEventListener('click', () => {
      form.reset();
      cityOther.hidden = true;
      ['name', 'phone', 'city', 'session'].forEach(f => setError(f, ''));
      document.getElementById('resultView').hidden = true;
      document.getElementById('formView').hidden = false;
      nameInput.focus();
    });
  </script>
</body>
</html>

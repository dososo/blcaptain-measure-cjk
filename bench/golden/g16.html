<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晚风小馆订座</title>
<style>
:where(:root:lang(zh)) { line-break: strict; }
:where(:lang(zh)) { font-synthesis-style: none; text-emphasis-position: under right; }
:where(:lang(zh)) :where(p, li) { line-height: 1.75; }
:where(:lang(zh)) :where(h1, h2, h3) { line-height: 1.3; }
.measure-prose { max-width: 36em; }
@supports (text-autospace: normal) { :where(:lang(zh)) { text-autospace: normal; } }
body { margin: 0; font-family: "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
<main style="max-width: 36em; margin: 0 auto; padding: 40px 20px;">
<h1 style="font-size: 30px; font-weight: 600; color: #1f2a2e;">晚风小馆订座</h1>
<h2 style="font-size: 21px; margin-top: 36px; color: #1f2a2e;">选择时间</h2>
<p style="font-size: 16px; line-height: 1.8; color: #333;">我们每天 17:00 开始营业，最后一桌入座时间是 21:00。八人以上的包间请直接打电话预订。</p>
<h2 style="font-size: 21px; margin-top: 36px; color: #1f2a2e;">订座须知</h2>
<ul><li style="font-size: 16px; line-height: 1.75;">保留座位 15 分钟，超时会自动取消。</li><li style="font-size: 16px; line-height: 1.75;">如需儿童座椅，请在备注里写明。</li><li style="font-size: 16px; line-height: 1.75;">店内不设最低消费。</li></ul>
</main>
</body>
</html>

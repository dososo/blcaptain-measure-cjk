<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团队 Git 使用规范</title>
<style>
:where(:root:lang(zh)) { line-break: strict; }
:where(:lang(zh)) { font-synthesis-style: none; text-emphasis-position: under right; }
:where(:lang(zh)) :where(p, li) { line-height: 1.75; }
:where(:lang(zh)) :where(h1, h2, h3) { line-height: 1.3; }
.measure-prose { max-width: 36em; }
@supports (text-autospace: normal) { :where(:lang(zh)) { text-autospace: normal; } }
body { margin: 0; font-family: "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
<main style="max-width: 36em; margin: 0 auto; padding: 40px 20px;">
<h1 style="font-size: 30px; font-weight: 600; color: #1f2a2e;">团队 Git 使用规范</h1>
<h2 style="font-size: 21px; margin-top: 36px; color: #1f2a2e;">分支命名</h2>
<p style="font-size: 16px; line-height: 1.8; color: #333;">功能分支以 feat 开头，修复分支以 fix 开头，后面跟上任务编号和简短说明。</p>
<h2 style="font-size: 21px; margin-top: 36px; color: #1f2a2e;">提交信息</h2>
<ol><li style="font-size: 16px; line-height: 1.75;">第一行写清楚做了什么，不超过 50 个字符。</li><li style="font-size: 16px; line-height: 1.75;">空一行之后写为什么这样做。</li><li style="font-size: 16px; line-height: 1.75;">关联的任务编号放在最后一行。</li></ol>
<h2 style="font-size: 21px; margin-top: 36px; color: #1f2a2e;">代码评审</h2>
<p style="font-size: 16px; line-height: 1.8; color: #333;">每个合并请求至少需要一位同事批准。评审意见请写具体的修改建议，而不是只写“这里不好”。</p>
</main>
</body>
</html>

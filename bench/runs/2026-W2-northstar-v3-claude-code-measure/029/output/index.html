<!doctype html>
<!--
  小红书 3:4 清单卡（1080×1440）：睡前书单
  - 字体：霞鹜文楷（LXGW WenKai，OFL-1.1，🟢 可以商用出图）。导出：
      measure-cjk card index.html --out card.png --font-dir <你的字体目录>
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>睡前书单</title>
<style>
:where(:lang(zh)) { line-break: strict; font-synthesis-style: none; text-autospace: normal; }
:root {
  --paper: #f4e9dc;    /* 米纸暖底 */
  --ink: #1f1b16;      /* 墨 */
  --ink-soft: #5a5148;
  --celadon: #7e8c6b;  /* 青瓷 */
  --cinnabar: #9e4b3b; /* 朱砂 */
  --rule: rgba(31, 27, 22, 0.12);
}
html, body { margin: 0; }
body {
  width: 1080px; height: 1440px; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: "LXGW WenKai", "霞鹜文楷", serif;
  font-weight: 400;
}
.card { box-sizing: border-box; width: 1080px; height: 1440px; padding: 112px 96px 96px; display: flex; flex-direction: column; }
.tag { font-size: 28px; line-height: 1.6; color: var(--celadon); margin: 0 0 20px; }
h1 { font-size: 76px; line-height: 1.3; font-weight: 400; margin: 0 0 20px; }
.sub { font-size: 32px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 56px; }
ol { list-style: none; margin: 0; padding: 0; }
li { display: flex; gap: 36px; padding: 26px 0; border-top: 2px solid var(--rule); }
li:last-child { border-bottom: 2px solid var(--rule); }
.no { flex: none; width: 56px; font-size: 36px; line-height: 1.5; color: var(--celadon); }
.body { min-width: 0; }
.title { font-size: 40px; line-height: 1.5; margin: 0; }
.author { font-size: 28px; color: var(--ink-soft); margin-left: 16px; }
.why { font-size: 30px; line-height: 1.7; color: var(--ink-soft); margin: 6px 0 0; }
.foot { margin-top: auto; font-size: 28px; line-height: 1.6; color: var(--cinnabar); }
</style>
</head>
<body>
<div class="card">
<p class="tag">晚安书单 · 第一期</p>
<h1>关灯前，读几页</h1>
<p class="sub">不烧脑、不揪心，读完刚好想睡。</p>
<ol>
<li><span class="no">01</span><div class="body"><p class="title">《人间草木》<span class="author">汪曾祺</span></p><p class="why">写花草、写吃食，淡淡的，像有人陪你散步。</p></div></li>
<li><span class="no">02</span><div class="body"><p class="title">《浮生六记》<span class="author">沈复</span></p><p class="why">寻常日子里的小欢喜，一篇几分钟就能读完。</p></div></li>
<li><span class="no">03</span><div class="body"><p class="title">《小王子》<span class="author">圣埃克苏佩里</span></p><p class="why">“真正重要的东西，用眼睛是看不见的。”</p></div></li>
<li><span class="no">04</span><div class="body"><p class="title">《瓦尔登湖》<span class="author">梭罗</span></p><p class="why">湖边的四季很慢，读着读着心就静下来。</p></div></li>
<li><span class="no">05</span><div class="body"><p class="title">《夜晚的潜水艇》<span class="author">陈春成</span></p><p class="why">短篇轻盈又奇妙，适合带着想象入梦。</p></div></li>
</ol>
<p class="foot">今晚先读哪一本？</p>
</div>
</body>
</html>

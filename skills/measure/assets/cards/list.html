<!doctype html>
<!--
  分寸 · Measure 小红书 3:4 卡片模板：清单卡（1080×1440）
  - 字体：霞鹜文楷（LXGW WenKai，OFL-1.1，🟢 可以商用出图）。把字体文件放进 font_dir，然后运行：
      measure-cjk card list.html --out card.png --font-dir <你的字体目录>
    card 命令只用 font_dir 里、授权表允许商用出图的字体；缺字时回退到的系统字体也要过授权表（F06）。
  - 只改文字，保持留白：标题不超过两行，正文每行不超过 26 个字。
  - 引号用 “”（measure.config.json 默认 quotes: curly），标点用全角。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>清单卡</title>
<style>
:where(:lang(zh)) { line-break: strict; font-synthesis-style: none; text-autospace: normal; }
:root {
  --paper: #f4e9dc;   /* 米纸暖底 */
  --ink: #1f1b16;     /* 墨 */
  --ink-soft: #5a5148;
  --celadon: #7e8c6b; /* 青瓷 */
  --cinnabar: #9e4b3b; /* 朱砂 */
}
html, body { margin: 0; }
body {
  width: 1080px; height: 1440px; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: "LXGW WenKai", "霞鹜文楷", serif;
  font-weight: 400;
}
.card { box-sizing: border-box; width: 1080px; height: 1440px; padding: 120px 96px 96px; display: flex; flex-direction: column; }
h1 { font-size: 72px; line-height: 1.3; font-weight: 400; margin: 0 0 24px; }
.sub { font-size: 32px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 72px; }
ol { list-style: none; margin: 0; padding: 0; }
li { display: flex; gap: 36px; font-size: 36px; line-height: 1.75; padding: 28px 0; border-top: 2px solid rgba(31, 27, 22, 0.12); }
.no { flex: none; width: 56px; color: var(--celadon); }
li:last-child { border-bottom: 2px solid rgba(31, 27, 22, 0.12); }
.foot { margin-top: auto; font-size: 28px; line-height: 1.6; color: var(--cinnabar); }
</style>
</head>
<body>
<div class="card">
<h1>出图前检查清单</h1>
<p class="sub">五分钟，避开最常见的问题。</p>
<ol>
<li><span class="no">01</span><span>字体能不能用于商用图片，先查授权表。</span></li>
<li><span class="no">02</span><span>标题字号越大，字重越轻。</span></li>
<li><span class="no">03</span><span>正文每行不超过二十六个字。</span></li>
<li><span class="no">04</span><span>中文不用斜体，强调改用着重号。</span></li>
<li><span class="no">05</span><span>四周留白不少于七十二像素。</span></li>
</ol>
<p class="foot">分寸 · Measure</p>
</div>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>上班族10分钟早餐</title>
<link rel="stylesheet" href="measure.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
<p class="tag">打工人早餐｜建议收藏</p>
<h1>上班族<span class="hl">10分钟</span>早餐</h1>
<p class="sub">多睡一会儿，也能好好吃一顿。</p>
<ol>
<li>
  <span class="no">01</span>
  <div class="body">
    <h2>微波炉鸡蛋杯<span class="time">3分钟</span></h2>
    <p>鸡蛋2个加牛奶30ml、火腿丁打散，微波高火90秒，中途搅一次。</p>
  </div>
</li>
<li>
  <span class="no">02</span>
  <div class="body">
    <h2>牛油果吐司<span class="time">5分钟</span></h2>
    <p>吐司烤脆，抹上牛油果泥，撒盐和黑胡椒，再盖一个煎蛋。</p>
  </div>
</li>
<li>
  <span class="no">03</span>
  <div class="body">
    <h2>隔夜燕麦杯<span class="time">早上0分钟</span></h2>
    <p>前一晚把燕麦、牛奶、酸奶装杯冷藏，早上加香蕉和坚果。</p>
  </div>
</li>
<li>
  <span class="no">04</span>
  <div class="body">
    <h2>葱香鸡蛋饼<span class="time">8分钟</span></h2>
    <p>面粉、鸡蛋、清水、葱花调成稀糊，小火摊薄，两面煎黄。</p>
  </div>
</li>
</ol>
<p class="foot">明天吃哪一款？<strong>先收藏，起床照着做。</strong></p>
</div>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活动报名</title>
  <!-- measure.css 放在第一个：它声明的 measure 层排在最前，其他样式都优先于它 -->
  <link rel="stylesheet" href="measure.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">线下活动 · 2026</p>
      <h1>活动报名</h1>
      <p class="intro">填写以下信息完成报名，我们会通过短信发送入场确认。带 * 的为必填项。</p>
    </header>

    <form id="signup" novalidate>
      <div class="field">
        <label for="name">姓名<span class="req">*</span></label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="20" required>
        <p class="err" hidden>请填写姓名</p>
      </div>

      <div class="field">
        <label for="phone">手机号<span class="req">*</span></label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" pattern="1[3-9]\d{9}" required>
        <p class="hint">用于接收入场确认短信</p>
        <p class="err" hidden>请输入 11 位有效手机号</p>
      </div>

      <div class="field">
        <label for="city">所在城市<span class="req">*</span></label>
        <select id="city" name="city" required>
          <option value="">请选择城市</option>
          <option>北京</option>
          <option>上海</option>
          <option>广州</option>
          <option>深圳</option>
          <option>杭州</option>
          <option>成都</option>
          <option>武汉</option>
          <option>其他</option>
        </select>
        <p class="err" hidden>请选择所在城市</p>
      </div>

      <fieldset class="field" id="session-field">
        <legend>参加场次<span class="req">*</span></legend>
        <div class="sessions">
          <label class="session">
            <input type="radio" name="session" value="11 月 15 日 上午场" required>
            <span><strong>11 月 15 日（周六）上午场</strong><small>09:30–12:00</small></span>
          </label>
          <label class="session">
            <input type="radio" name="session" value="11 月 15 日 下午场">
            <span><strong>11 月 15 日（周六）下午场</strong><small>14:00–17:00</small></span>
          </label>
          <label class="session">
            <input type="radio" name="session" value="11 月 16 日 全天场">
            <span><strong>11 月 16 日（周日）全天场</strong><small>09:30–17:00</small></span>
          </label>
        </div>
        <p class="err" hidden>请选择一个场次</p>
      </fieldset>

      <button type="submit">提交报名</button>
    </form>

    <section class="done" id="done" hidden aria-live="polite">
      <h2>报名成功</h2>
      <p id="summary"></p>
      <button type="button" class="link" id="again">再报一位</button>
    </section>
  </main>

  <script>
    const form = document.getElementById('signup');
    const done = document.getElementById('done');

    function setError(field, bad) {
      field.classList.toggle('invalid', bad);
      field.querySelector('.err').hidden = !bad;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = form.name.value.trim();
      const phone = form.phone.value.trim();
      const city = form.city.value;
      const session = form.querySelector('input[name="session"]:checked');

      const checks = [
        [form.name.closest('.field'), !name],
        [form.phone.closest('.field'), !/^1[3-9]\d{9}$/.test(phone)],
        [form.city.closest('.field'), !city],
        [document.getElementById('session-field'), !session]
      ];
      checks.forEach(([f, bad]) => setError(f, bad));

      const firstBad = checks.find(([, bad]) => bad);
      if (firstBad) {
        const el = firstBad[0].querySelector('input, select');
        if (el) el.focus();
        return;
      }

      document.getElementById('summary').textContent =
        `${name}，你已报名${city}“${session.value}”。确认短信将发送至 ${phone.slice(0, 3)}****${phone.slice(7)}。`;
      form.hidden = true;
      done.hidden = false;
    });

    form.addEventListener('input', (e) => {
      const field = e.target.closest('.field');
      if (field && field.classList.contains('invalid')) setError(field, false);
    });

    document.getElementById('again').addEventListener('click', () => {
      form.reset();
      done.hidden = true;
      form.hidden = false;
      form.name.focus();
    });
  </script>
</body>
</html>

<h1>周末骑行社招新</h1>
<p class="lead">我们每周六早上出发，路线在 40 到 80 公里之间，配速不快，等人是常态。</p>
<h2>活动怎么安排</h2>
<ul><li>每周六 7:00 在体育公园北门集合。</li><li>每月第一个周日安排一次长途，距离不超过 120 公里。</li><li>雨天取消，提前一晚在群里通知。</li></ul>
<h2>路线难度</h2>
<p>新手路线基本是平路，累计爬升不到 200 米。进阶路线会有两段山路，需要你能连续骑行三小时。</p>
<h2>怎么报名</h2>
<p>填写报名表后，我们会在三天内联系你，第一次活动可以借用俱乐部的备用头盔。</p>

<!doctype html>
<!--
  小红书 3:4 卡片：周末两天一夜杭州路线（1080×1440）
  字体：霞鹜文楷（LXGW WenKai，OFL-1.1，🟢 可以商用出图）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>两天一夜杭州路线</title>
<style>@layer measure;</style>
<link rel="stylesheet" href="measure.css">
<style>
:root {
  --paper: #f4e9dc;    /* 米纸 */
  --ink: #1f1b16;      /* 墨 */
  --ink-soft: #5a5148;
  --celadon: #6f8063;  /* 青瓷 */
  --cinnabar: #9e4b3b; /* 朱砂 */
  --rule: rgba(31, 27, 22, 0.12);
}
html, body { margin: 0; }
body {
  width: 1080px; height: 1440px; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: "LXGW WenKai", "霞鹜文楷", serif;
  font-weight: 400;
}
.card {
  box-sizing: border-box; width: 1080px; height: 1440px;
  padding: 96px 96px 88px;
  display: flex; flex-direction: column;
}
.tag { margin: 0 0 20px; font-size: 28px; line-height: 1.6; color: var(--cinnabar); }
h1 { margin: 0 0 16px; font-size: 76px; line-height: 1.3; font-weight: 400; }
.sub { margin: 0 0 44px; font-size: 30px; line-height: 1.6; color: var(--ink-soft); }

.day { margin: 0 0 36px; }
.day h2 {
  display: flex; align-items: baseline; gap: 20px;
  margin: 0 0 8px; font-size: 40px; line-height: 1.3; font-weight: 400;
}
.day h2 .no { font-size: 28px; color: var(--celadon); }
ol { list-style: none; margin: 0; padding: 0; }
li {
  display: flex; gap: 32px;
  font-size: 32px; line-height: 1.6;
  padding: 8px 0; border-top: 2px solid var(--rule);
}
li:last-child { border-bottom: 2px solid var(--rule); }
.t { flex: none; width: 64px; color: var(--celadon); }

.foot {
  margin: auto 0 0; max-width: 26em; font-size: 28px; line-height: 1.7; color: var(--ink-soft);
}
.foot b { font-weight: 400; color: var(--cinnabar); }
</style>
</head>
<body>
<div class="card">
<p class="tag">杭州 · 周末路线</p>
<h1>两天一夜，慢游杭州</h1>
<p class="sub">一天看湖，一天进山，节奏松一点刚刚好。</p>

<section class="day">
<h2><span class="no">01</span>第一天 · 西湖一圈</h2>
<ol>
<li><span class="t">上午</span><span>断桥、白堤、孤山，沿湖慢慢走</span></li>
<li><span class="t">中午</span><span>知味观吃片儿川、小笼包</span></li>
<li><span class="t">下午</span><span>苏堤骑车，穿过六座桥</span></li>
<li><span class="t">傍晚</span><span>雷峰塔下看西湖日落</span></li>
<li><span class="t">夜里</span><span>湖滨步行街散步，住湖滨一带</span></li>
</ol>
</section>

<section class="day">
<h2><span class="no">02</span>第二天 · 山里与老街</h2>
<ol>
<li><span class="t">清早</span><span>灵隐寺、飞来峰，早去人少</span></li>
<li><span class="t">上午</span><span>九溪十八涧徒步到龙井村</span></li>
<li><span class="t">中午</span><span>茶园边吃农家菜，喝杯龙井</span></li>
<li><span class="t">下午</span><span>河坊街、南宋御街，买完伴手礼返程</span></li>
</ol>
</section>

<p class="foot"><b>小贴士：</b>西湖周边少开车，地铁加共享单车最方便；周末热门景点尽量早出门。</p>
</div>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>审计复现夹具</title>
<style>
:where(:lang(zh)) { line-break: strict; font-synthesis-style: none; }
@supports (text-autospace: normal) { :where(:lang(zh)) { text-autospace: normal; } }
body { font-family: "Inter", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 16px; margin: 0; }
main { max-width: 36em; margin: 0 auto; padding: 0 16px; }
p, li { line-height: 1.75; }
h1 { line-height: 1.3; }
.neg { letter-spacing: -2px; }
</style>
</head>
<body>
<main>
<details><summary>展开</summary><p class="neg">折叠内容里的中文，字距为负。</p></details>
<p><span class="neg" style="display: contents">显示为内容的中文，字距为负</span></p>
</main>
</body>
</html>

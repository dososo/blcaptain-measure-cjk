<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上班族 10 分钟早餐</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="head">
      <div class="tag">☀️ 打工人早餐合集</div>
      <h1>上班族<br><span class="hl">10 分钟</span>早餐</h1>
      <p class="sub">不用早起 · 不洗一堆锅 · 吃饱不犯困</p>
    </header>

    <section class="list">
      <article class="item">
        <div class="num">01</div>
        <div class="body">
          <h2>🥑 牛油果溏心蛋吐司 <em>6 min</em></h2>
          <p>吐司烤脆 → 牛油果压泥抹上 → 盖溏心蛋，撒黑胡椒 + 盐</p>
        </div>
      </article>

      <article class="item">
        <div class="num">02</div>
        <div class="body">
          <h2>🥣 酸奶隔夜燕麦杯 <em>2 min</em></h2>
          <p>前一晚燕麦 + 牛奶 + 酸奶入罐冷藏，早上铺香蕉、坚果直接开吃</p>
        </div>
      </article>

      <article class="item">
        <div class="num">03</div>
        <div class="body">
          <h2>🍳 微波炉蔬菜蛋杯 <em>4 min</em></h2>
          <p>马克杯打 2 个蛋，加玉米粒、火腿丁、少许盐，微波 1 分半搞定</p>
        </div>
      </article>

      <article class="item">
        <div class="num">04</div>
        <div class="body">
          <h2>🌯 手抓饼鸡蛋卷 <em>8 min</em></h2>
          <p>冷冻手抓饼煎至鼓起，磕蛋翻面，卷生菜 + 鸡胸肉，挤点番茄酱</p>
        </div>
      </article>
    </section>

    <footer class="foot">
      <span>💡 搭配一杯牛奶 / 美式，蛋白质碳水都有了</span>
      <span class="save">建议收藏 ⭐</span>
    </footer>
  </main>
</body>
</html>

<!doctype html>
<!--
  小红书 3:4 知识卡片（1080×1440），基于 measure-skill 清单卡模板改写。
  字体：Noto Sans SC（OFL-1.1，🟢 可嵌入、可商用出图）。
  导出：measure-cjk card index.html --out card.png --font-dir <放 Noto Sans SC 的目录>
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>理财新手先搞懂这3个词</title>
<style>
:where(:lang(zh)) { line-break: strict; font-synthesis-style: none; text-autospace: normal; }
:root {
  --paper: #f4ede2;    /* 米纸 */
  --ink: #1f1b16;      /* 墨 */
  --ink-soft: #5a5148;
  --line: rgba(31, 27, 22, 0.12);
  --celadon: #5f7a6a;  /* 青瓷 */
  --cinnabar: #a4473a; /* 朱砂 */
}
html, body { margin: 0; }
body {
  width: 1080px; height: 1440px; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: "Noto Sans SC", sans-serif;
  font-weight: 400;
}
.card { box-sizing: border-box; width: 1080px; height: 1440px; padding: 112px 96px 96px; display: flex; flex-direction: column; }
.tag { font-size: 28px; line-height: 1.6; color: var(--celadon); margin: 0 0 20px; }
h1 { font-size: 72px; line-height: 1.3; font-weight: 700; margin: 0 0 24px; }
h1 .hl { color: var(--cinnabar); }
.sub { font-size: 32px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 56px; }
ol { list-style: none; margin: 0; padding: 0; }
li { display: flex; gap: 36px; padding: 32px 0; border-top: 2px solid var(--line); }
li:last-child { border-bottom: 2px solid var(--line); }
.no { flex: none; width: 64px; font-size: 40px; line-height: 1.4; font-weight: 700; color: var(--celadon); }
.body { min-width: 0; }
.term { font-size: 48px; line-height: 1.3; font-weight: 700; margin: 0 0 8px; }
.gist { font-size: 36px; line-height: 1.6; color: var(--cinnabar); margin: 0 0 8px; }
.eg { font-size: 30px; line-height: 1.75; color: var(--ink-soft); margin: 0; }
.foot { margin-top: auto; display: flex; justify-content: space-between; gap: 24px; font-size: 26px; line-height: 1.6; color: var(--ink-soft); }
.foot strong { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
<div class="card">
<p class="tag">理财入门 · 第1课</p>
<h1>理财新手先搞懂这<span class="hl">3</span>个词</h1>
<p class="sub">看懂它们，少踩一半的坑。</p>
<ol>
<li><span class="no">01</span><div class="body">
  <p class="term">复利</p>
  <p class="gist">利息也能再生利息。</p>
  <p class="eg">年化10%，10年后本金约变成2.6倍；时间越长，差距越大。</p>
</div></li>
<li><span class="no">02</span><div class="body">
  <p class="term">通货膨胀</p>
  <p class="gist">钱放着不动，也会悄悄“变小”。</p>
  <p class="eg">通胀3%时，今天的100元，一年后只够买约97元的东西。</p>
</div></li>
<li><span class="no">03</span><div class="body">
  <p class="term">流动性</p>
  <p class="gist">钱能多快变回现金。</p>
  <p class="eg">活期随取随用，定期提前取会损失利息；先留好3–6个月生活费再投资。</p>
</div></li>
</ol>
<p class="foot"><strong>收藏起来，下次理财前看一眼</strong><span>仅为科普，不构成投资建议</span></p>
</div>
</body>
</html>

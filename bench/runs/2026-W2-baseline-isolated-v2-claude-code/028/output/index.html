<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>理财新手先搞懂这 3 个词</title>
<style>
  :root {
    --bg: #f3ede4;
    --card: #fffaf2;
    --ink: #2b2420;
    --sub: #7a6a5e;
    --accent: #e8553e;
    --c1: #ffd9c9;
    --c2: #d6e8d4;
    --c3: #d7e1f3;
    --line: #eadfce;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
    padding: 24px 16px;
  }
  .card {
    width: min(540px, 100%, calc((100vh - 48px) * 0.75));
    aspect-ratio: 3 / 4;
    background: var(--card);
    border-radius: 4%/3%;
    box-shadow: 0 12px 40px rgba(80, 50, 20, .12);
    padding: 7% 7% 5%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    container-type: inline-size;
  }
  .card::before {
    content: "";
    position: absolute;
    right: -18%; top: -12%;
    width: 55%; aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, #ffe3b8 0%, rgba(255,227,184,0) 70%);
  }
  .tag {
    position: relative;
    align-self: flex-start;
    font-size: 3cqw;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    padding: .4em 1em;
    border-radius: 999px;
    letter-spacing: .05em;
  }
  h1 {
    position: relative;
    margin-top: 4cqw;
    font-size: 8.6cqw;
    line-height: 1.25;
    font-weight: 800;
    letter-spacing: .01em;
  }
  h1 .hl {
    background: linear-gradient(transparent 60%, #ffd27a 60%);
    padding: 0 .05em;
  }
  h1 .num { color: var(--accent); font-size: 1.2em; }
  .lead {
    position: relative;
    margin-top: 2.4cqw;
    font-size: 3.4cqw;
    color: var(--sub);
  }
  .list {
    margin-top: 5cqw;
    display: flex;
    flex-direction: column;
    gap: 3.2cqw;
    flex: 1;
  }
  .item {
    display: flex;
    gap: 3.4cqw;
    border-radius: 4cqw;
    padding: 3.6cqw 4cqw;
    align-items: flex-start;
  }
  .item:nth-child(1) { background: var(--c1); }
  .item:nth-child(2) { background: var(--c2); }
  .item:nth-child(3) { background: var(--c3); }
  .idx {
    flex: none;
    width: 9cqw; height: 9cqw;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    font-size: 4.4cqw;
    font-weight: 800;
    display: grid;
    place-items: center;
  }
  .body { min-width: 0; }
  .term {
    font-size: 5.2cqw;
    font-weight: 800;
    display: flex;
    align-items: baseline;
    gap: 2cqw;
    flex-wrap: wrap;
  }
  .term small {
    font-size: 2.8cqw;
    font-weight: 500;
    color: var(--sub);
    letter-spacing: .04em;
  }
  .def {
    margin-top: 1.2cqw;
    font-size: 3.3cqw;
    line-height: 1.6;
  }
  .eg {
    margin-top: 1.4cqw;
    font-size: 2.9cqw;
    line-height: 1.55;
    color: #4d4038;
    background: rgba(255,255,255,.6);
    border-radius: 2cqw;
    padding: 1.4cqw 2.4cqw;
  }
  .eg b { color: var(--accent); }
  .foot {
    margin-top: 4cqw;
    padding-top: 3cqw;
    border-top: 1.5px dashed var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 2.9cqw;
    color: var(--sub);
  }
  .foot strong { color: var(--ink); }
</style>
</head>
<body>
  <article class="card">
    <span class="tag">💰 理财入门 · 第 1 课</span>
    <h1>理财新手<br>先搞懂这 <span class="num">3</span> 个<span class="hl">词</span></h1>
    <p class="lead">看懂它们，再决定钱往哪儿放 👇</p>

    <section class="list">
      <div class="item">
        <div class="idx">1</div>
        <div class="body">
          <div class="term">复利 <small>COMPOUND INTEREST</small></div>
          <p class="def">利息也会生利息，时间越长，滚得越快。</p>
          <p class="eg">1 万元、年化 5%：单利 20 年 ≈ 2 万；复利 20 年 ≈ <b>2.65 万</b></p>
        </div>
      </div>
      <div class="item">
        <div class="idx">2</div>
        <div class="body">
          <div class="term">通货膨胀 <small>INFLATION</small></div>
          <p class="def">物价慢慢上涨，同样的钱能买的东西变少。</p>
          <p class="eg">通胀 3% 时，收益低于 3% 的存款，<b>实际在缩水</b></p>
        </div>
      </div>
      <div class="item">
        <div class="idx">3</div>
        <div class="body">
          <div class="term">流动性 <small>LIQUIDITY</small></div>
          <p class="def">钱能多快、多少损耗地变回现金。</p>
          <p class="eg">先留 <b>3–6 个月生活费</b> 在随取随用的地方，再谈投资</p>
        </div>
      </div>
    </section>

    <footer class="foot">
      <span>📌 <strong>收藏</strong>，下期讲「资产配置」</span>
      <span>仅作科普 · 不构成投资建议</span>
    </footer>
  </article>
</body>
</html>

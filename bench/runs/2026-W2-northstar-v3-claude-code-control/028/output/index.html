<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>理财新手先搞懂这 3 个词</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="head">
      <span class="tag">理财入门 · 第 1 课</span>
      <h1>理财新手<br>先搞懂这 <em>3</em> 个词</h1>
      <p class="sub">看懂它们，才不会被“高收益”忽悠</p>
    </header>

    <section class="item">
      <div class="num">01</div>
      <div class="body">
        <h2>复利 <span>钱生钱，利滚利</span></h2>
        <p>赚到的收益不取出，继续投入下一轮，一起生息。</p>
        <div class="eg">
          <b>1 万元 · 年化 5% · 10 年</b>
          <div class="bar"><i style="width:61%"></i><label>单利 ≈ 1.50 万</label></div>
          <div class="bar hot"><i style="width:67%"></i><label>复利 ≈ 1.63 万</label></div>
        </div>
      </div>
    </section>

    <section class="item">
      <div class="num">02</div>
      <div class="body">
        <h2>年化收益率 <span>换算成“一年”的收益</span></h2>
        <p>不同期限的产品，统一按一年来比较才公平。</p>
        <div class="eg">
          <b>3 个月赚 1%</b> ≈ 年化 <strong>4%</strong><br>
          <small>⚠️ 年化 ≠ 你一定能拿到的钱，要看实际持有天数</small>
        </div>
      </div>
    </section>

    <section class="item">
      <div class="num">03</div>
      <div class="body">
        <h2>流动性 <span>多快能把钱取出来</span></h2>
        <p>越容易随时变现，流动性越好，通常收益也越低。</p>
        <div class="eg scale">
          <span>活期 / 货币基金</span><span class="arrow">→</span><span>定期 / 理财</span><span class="arrow">→</span><span>房产</span>
        </div>
      </div>
    </section>

    <footer class="foot">
      <p>💡 口诀：<b>收益、风险、流动性</b>，三者不可兼得</p>
      <span>收藏备用 ⭐ 不构成投资建议</span>
    </footer>
  </main>
</body>
</html>

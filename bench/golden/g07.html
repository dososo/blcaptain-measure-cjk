<h1>《置身事内》读书笔记</h1>
<p class="lead">这本书讲的是地方政府如何参与经济发展。读完之后，我对很多新闻有了不一样的理解。</p>
<h2>收获一：财政决定了很多事</h2>
<p>地方政府的收入从哪里来、花到哪里去，决定了它会优先做什么。很多看似突然的政策，背后都有财政上的原因。</p>
<h2>收获二：土地是关键</h2>
<p>书里用了大量篇幅解释土地财政的来龙去脉。理解了这一点，再看城市扩张和房价，就不会只看到表面。</p>
<h2>收获三：没有简单的答案</h2>
<p>作者反复强调，每一种做法都有它的代价。与其急着下结论，不如先弄清楚约束条件是什么。</p>
</main>

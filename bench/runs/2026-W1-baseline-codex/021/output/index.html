<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f4ec">
  <title>同频 · 城市灵感聚会｜活动报名</title>
  <style>
    :root{--paper:#f5f4ec;--ink:#293b2e;--muted:#788073;--line:#e2e4d9;--green:#344c36;--yellow:#edd571}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}a{color:inherit}header{height:102px;max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 8px}.brand{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:700;letter-spacing:3px}.brand-icon{width:36px;height:36px}.brand-sub{border-left:1px solid #cdd2c5;padding-left:18px;margin-left:7px;font-size:12px;font-weight:400;letter-spacing:2px;color:#747e71}.header-note{font-size:12px;display:flex;gap:9px;align-items:center}.dot{width:6px;height:6px;background:#6e8554;border-radius:50%;display:inline-block}main{max-width:1160px;margin:62px auto 68px;display:grid;grid-template-columns:1.12fr 1fr;gap:86px;align-items:start}.intro{padding-top:12px}.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid #d9dece;border-radius:30px;font-size:11px;letter-spacing:2px;padding:8px 12px}.eyebrow span{color:#879575}h1{font-size:56px;letter-spacing:-2px;line-height:1.3;font-weight:600;margin:23px 0 20px}h1 em{font-style:normal;position:relative;z-index:0;white-space:nowrap}h1 em:after{content:"";position:absolute;bottom:3px;left:0;right:-5px;height:14px;background:var(--yellow);z-index:-1;transform:rotate(-2deg)}.lead{color:#737c6e;line-height:1.9;font-size:14px;margin:0}.art{position:relative;height:254px;margin-top:19px;overflow:hidden}.art svg{width:100%;height:100%;overflow:visible}.art-label{position:absolute;bottom:13px;left:5px;font-size:10px;letter-spacing:3px;color:#6e7b63}.event-meta{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #d9dfd0;margin-top:15px;padding-top:23px;gap:20px}.meta-item{display:flex;gap:11px;align-items:flex-start}.meta-item svg{width:19px;height:19px;flex:none;margin-top:2px}.meta-item strong{display:block;font-size:13px;font-weight:500;margin-bottom:7px}.meta-item span{display:block;color:var(--muted);font-size:11px}.card{padding:34px 35px 30px;background:#fffef9;border:1px solid #e4e6da;border-radius:17px;box-shadow:0 12px 40px #35482c06}.card-top{display:flex;align-items:center;justify-content:space-between}.card-top h2{font-size:23px;font-weight:600;letter-spacing:1px;margin:0}.free{font-size:11px;background:#edf1e5;color:#63744c;border-radius:5px;padding:6px 9px}.card-desc{font-size:12px;color:var(--muted);margin:10px 0 27px}.field{margin-bottom:20px}label,.legend{display:block;font-size:12px;font-weight:500;margin-bottom:9px}.required{color:#8a9575;margin-left:4px}input[type=text],input[type=tel]{width:100%;height:47px;border:1px solid #dfe3d6;background:#fffefb;border-radius:7px;padding:0 14px;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}input::placeholder{color:#a4a99d}input:focus{border-color:#738561;box-shadow:0 0 0 3px #82946818}fieldset{padding:0;margin:0 0 24px;border:0;min-width:0}legend{padding:0}.sessions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.session{position:relative;cursor:pointer;margin:0}.session input{position:absolute;top:16px;right:12px;width:14px;height:14px;margin:0;accent-color:var(--green)}.session-box{display:block;border:1px solid #dfe3d6;border-radius:7px;padding:13px 12px;background:#fffefb;transition:all .2s}.session input:checked+.session-box{border-color:#718365;background:#f1f4ea}.session input:focus-visible+.session-box{outline:3px solid #bccca7;outline-offset:2px}.session-title{display:block;font-size:12px;padding-right:16px;margin-bottom:8px}.session-date{display:block;font-size:11px;color:#748067;line-height:1.7;font-weight:400}.submit{border:0;width:100%;height:49px;border-radius:7px;background:var(--green);color:#fffef9;display:flex;align-items:center;justify-content:center;gap:17px;font-size:14px;letter-spacing:1px;transition:background .2s,transform .2s}.submit:hover{background:#243d28;transform:translateY(-1px)}.submit:active{transform:translateY(0)}.submit:focus-visible{outline:3px solid #9cad8a;outline-offset:3px}.privacy{display:flex;align-items:flex-start;justify-content:center;gap:6px;color:#8c9485;font-size:10px;line-height:1.8;margin:13px 0 0}.privacy svg{width:12px;height:12px;flex:none;margin-top:2px}.feedback{margin:17px 0 0;padding:12px;background:#eef2e6;border-radius:6px;font-size:12px;line-height:1.8;color:#405539}.feedback[hidden]{display:none}.card-bottom{border-top:1px solid #e9ecdf;margin-top:23px;padding-top:18px;display:flex;justify-content:center;gap:7px;font-size:11px;color:#939a89}.card-bottom span{color:#5e7051}.footer{max-width:1280px;margin:auto;border-top:1px solid var(--line);padding:24px 8px 27px;display:flex;justify-content:space-between;color:#93998b;font-size:10px;letter-spacing:1px}.footer span:last-child{letter-spacing:0}.reveal{animation:appear .65s ease-out both}.card.reveal{animation-delay:.12s}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @media(min-width:1500px){main{margin-top:85px;margin-bottom:85px}}@media(max-width:1300px){header,.footer{margin-left:5%;margin-right:5%}main{margin-left:8%;margin-right:8%;gap:6%}h1{font-size:48px}.card{padding:30px}}@media(max-width:900px){main{margin:40px 6% 45px;gap:5%;grid-template-columns:1fr 1fr}h1{font-size:39px}.card{padding:25px 22px}.brand-sub{display:none}.event-meta{grid-template-columns:1fr;gap:18px}.art{height:230px}.session-title{font-size:11px}.session-box{padding-left:9px}.session-date{font-size:10px}}@media(max-width:660px){header{height:78px}.brand{font-size:23px}.header-note{font-size:10px}main{display:block;margin:30px 6% 35px}.intro{padding:0}h1{font-size:44px;line-height:1.25;margin:20px 0}.lead{font-size:13px}.art{height:200px;margin:12px auto 0;max-width:420px}.event-meta{grid-template-columns:1fr 1fr;margin:5px 0 31px;padding-top:18px;gap:12px}.meta-item strong{font-size:12px}.meta-item span{font-size:10px}.card{padding:27px 24px}.session-title{font-size:12px}.session-date{font-size:11px}.footer{gap:15px;line-height:1.7;flex-direction:column;padding:20px 0}.footer span:last-child{font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><svg class="brand-icon" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M7 11v18M15 6v28M24 10v20M33 15v10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>同频<span class="brand-sub">让相遇，有回响</span></div>
    <div class="header-note"><span class="dot"></span>城市灵感聚会 · 开放报名</div>
  </header>
  <main>
    <section class="intro reveal" aria-labelledby="event-title">
      <div class="eyebrow"><span>●</span> 同频计划 · 第 01 期</div>
      <h1 id="event-title">周末，<br>把<em>灵感碰出来。</em></h1>
      <p class="lead">走出日常，遇见有趣的人。<br>一场关于分享、连接与新可能的城市聚会。</p>
      <div class="art" role="img" aria-label="黄色与绿色的交叠圆环，象征人与灵感的相遇">
        <svg viewBox="0 0 520 260" fill="none" aria-hidden="true">
          <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#cdd2c1"/></pattern><linearGradient id="sun" x1="130" y1="50" x2="300" y2="230" gradientUnits="userSpaceOnUse"><stop stop-color="#f2da7d"/><stop offset="1" stop-color="#d9bc4e"/></linearGradient></defs>
          <rect x="5" y="7" width="510" height="240" fill="url(#grid)"/>
          <ellipse cx="270" cy="224" rx="183" ry="12" fill="#d7dbc9" opacity=".3"/>
          <g transform="rotate(-24 201 134)"><ellipse cx="201" cy="139" rx="91" ry="77" stroke="#cfb14b" stroke-width="37"/><ellipse cx="201" cy="130" rx="91" ry="77" stroke="url(#sun)" stroke-width="37"/></g>
          <g transform="rotate(-24 329 142)"><ellipse cx="329" cy="147" rx="87" ry="72" stroke="#354c34" stroke-width="36"/><ellipse cx="329" cy="139" rx="87" ry="72" stroke="#6e8054" stroke-width="36"/></g>
          <path d="M235 47C267 58 290 82 296 109" stroke="#ebd16d" stroke-width="36"/>
          <path d="M424 35v26M411 48h26" stroke="#7c8c64" stroke-width="2"/><circle cx="80" cy="179" r="6" fill="#b7c39c"/><circle cx="370" cy="37" r="3" fill="#d7b957"/>
          <path d="M63 95c13-10 29-14 44-13M59 106l-3-12 12-4" stroke="#8b987a" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span class="art-label">不同的你我，同频的此刻。</span>
      </div>
      <div class="event-meta">
        <div class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h3m3 0h3"/></svg><div><strong>11 月 7 日 — 8 日</strong><span>2026 · 选择适合你的场次</span></div></div>
        <div class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><div><strong>城市线下见面</strong><span>活动地点以主办方通知为准</span></div></div>
      </div>
    </section>
    <section class="card reveal" aria-labelledby="form-title">
      <div class="card-top"><h2 id="form-title">留一个位置给你</h2><span class="free">免费参与</span></div>
      <p class="card-desc">填写以下信息，开启一次新的相遇。<span aria-hidden="true">↘</span></p>
      <form id="registration-form">
        <div class="field"><label for="name">你的姓名<span class="required" aria-hidden="true">*</span></label><input id="name" name="name" type="text" placeholder="怎么称呼你？" autocomplete="name" maxlength="40" required></div>
        <div class="field"><label for="phone">手机号<span class="required" aria-hidden="true">*</span></label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="请输入 11 位中国大陆手机号" pattern="1[3-9][0-9]{9}" maxlength="11" title="请输入以 1 开头的 11 位中国大陆手机号" required></div>
        <div class="field"><label for="city">所在城市<span class="required" aria-hidden="true">*</span></label><input id="city" name="city" type="text" autocomplete="address-level2" list="cities" placeholder="输入或选择你所在的城市" maxlength="40" required><datalist id="cities"><option value="北京"><option value="上海"><option value="广州"><option value="深圳"><option value="杭州"><option value="成都"><option value="武汉"><option value="南京"></datalist></div>
        <fieldset><legend class="legend">参加场次<span class="required" aria-hidden="true">*</span></legend><div class="sessions">
          <label class="session"><input type="radio" name="session" value="11 月 7 日（周六）14:00—17:00" required checked><span class="session-box"><strong class="session-title">周六 · 灵感碰面</strong><span class="session-date">11 月 7 日<br>14:00 — 17:00</span></span></label>
          <label class="session"><input type="radio" name="session" value="11 月 8 日（周日）14:00—17:00" required><span class="session-box"><strong class="session-title">周日 · 同频交流</strong><span class="session-date">11 月 8 日<br>14:00 — 17:00</span></span></label>
        </div></fieldset>
        <button class="submit" type="submit">确认报名 <span aria-hidden="true">↗</span></button>
        <p class="privacy"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5 7V5a3 3 0 0 1 6 0v2m-3 3v2"/></svg>本页为演示，信息仅在当前页面校验，不会上传或保存。</p>
        <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      </form>
      <div class="card-bottom">带上好奇心就好，<span>我们期待与你相遇。</span></div>
    </section>
  </main>
  <footer class="footer"><span>同频 · 让每一次相遇，都有新的可能。</span><span>示例活动报名页 · 标有 * 的项目为必填项</span></footer>
  <script>
    const form = document.querySelector('#registration-form');
    const feedback = document.querySelector('#feedback');
    for (const field of form.querySelectorAll('input[type="text"]')) {
      field.addEventListener('input', () => {
        field.setCustomValidity(field.value.trim() ? '' : '请填写此项，不能只输入空格。');
      });
    }
    form.addEventListener('input', () => { feedback.hidden = true; });
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = form.elements.name.value.trim();
      const city = form.elements.city.value.trim();
      if (!name || !city) return;
      feedback.textContent = `${name}，你的信息已通过校验。所在城市：${city}；所选场次：${form.elements.session.value}。本页尚未接入报名服务，未实际提交报名。`;
      feedback.hidden = false;
    });
  </script>
</body>
</html>

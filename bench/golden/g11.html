<h1>tidy 快速上手</h1>
<p class="lead">tidy 是一个整理下载文件夹的命令行工具，三分钟就能装好。</p>
<h2>安装</h2>
<pre><code>brew install tidy-cli
tidy --version</code></pre>
<h2>配置</h2>
<p>第一次运行时，tidy 会在用户目录下生成配置文件。你可以在里面指定哪些后缀的文件放进哪个文件夹。</p>
<h2>三个常用命令</h2>
<ul><li><code>tidy scan</code>：只扫描，不移动任何文件。</li><li><code>tidy run</code>：按照配置整理文件。</li><li><code>tidy undo</code>：撤销最近一次整理。</li></ul>
</main>

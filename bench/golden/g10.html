<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接口按量计费</title>
<style>
:where(:root:lang(zh)) { line-break: strict; }
:where(:lang(zh)) { font-synthesis-style: none; text-emphasis-position: under right; }
:where(:lang(zh)) :where(p, li) { line-height: 1.75; }
:where(:lang(zh)) :where(h1, h2, h3) { line-height: 1.3; }
.measure-prose { max-width: 36em; }
@supports (text-autospace: normal) { :where(:lang(zh)) { text-autospace: normal; } }
body { margin: 0; font-family: "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 17px; color: #26221f; background: #faf7f2; }
main { margin: 0 auto; padding: 56px 24px; }
h1 { font-size: 34px; font-weight: 500; letter-spacing: 0.02em; }
h2 { font-size: 22px; font-weight: 600; margin-top: 44px; }
.lead { font-size: 19px; color: #5b524a; }
.eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #8a7d70; }

</style>
</head>
<body>
<main class="measure-prose">
<h1>接口按量计费</h1>
<p class="lead">注册即送每月 10 万次免费调用，超出部分按实际用量计费，不设最低消费。</p>
<h2>价格</h2>
<ul><li>文本接口：每千次 0.8 元。</li><li>图片接口：每千次 3.5 元。</li><li>批量接口：每千次 0.5 元，单次请求不超过 100 条。</li></ul>
<h2>怎么计费</h2>
<p>每天凌晨 2 点结算前一天的用量，账单会发送到你的注册邮箱。余额不足时，接口会返回 402 状态码，不会产生欠费。</p>
</main>
</body>
</html>

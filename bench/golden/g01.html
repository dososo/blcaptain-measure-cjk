<title>山间烘焙所</title>
<style>

:where(:lang(zh)) :where(p, li) { line-height: 1.75; }

.measure-prose { max-width: 36em; }
@supports (text-autospace: normal) { :where(:lang(zh)) { text-autospace: normal; } }
body { margin: 0; font-family: "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 17px; color: #26221f; background: #faf7f2; }
main { margin: 0 auto; padding: 56px 24px; }

h2 { font-size: 22px; font-weight: 600; margin-top: 44px; }

<body>
<main class="measure-prose">
<span class="eyebrow">Roastery</span>
<h1>山间烘焙所</h1>
<p class="lead">我们只做小批量烘焙。每一袋豆子都写着产地、处理法和烘焙日期，拆开之后，你喝到的是这一周的味道。</p>
<h2>这周在烘什么</h2>
<ul><li>云南保山小粒咖啡，日晒处理，带一点熟李子的甜。</li><li>埃塞俄比亚耶加雪菲，水洗处理，柑橘和茉莉花香很明显。</li><li>哥伦比亚慧兰，浅中烘，适合做手冲也适合做冷萃。</li></ul>
<h2>我们怎么烘</h2>
<p>一锅只烘 5 公斤，出锅后静置 48 小时再封袋。烘焙曲线每次都会记录，同一支豆子如果味道不对，我们宁可不卖。</p>
<h2>到店喝一杯</h2>
<p>地址在老城区青石巷 12 号，周二到周日 9:00–18:00 营业。店里只有六个座位，周末建议提前来。</p>
</main>

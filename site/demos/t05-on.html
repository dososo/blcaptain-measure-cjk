<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>示意 T05（开）</title>
<style>
:where(:lang(zh)) { line-break: strict; text-autospace: normal; font-synthesis-style: none; }
html, body { margin: 0; background: #f4e9dc; color: #1f1b16; font-family: "Noto Sans SC", sans-serif; }
.demo { box-sizing: border-box; width: 1040px; padding: 40px 44px; }
.demo p { font-size: 18px; line-height: 1.75; margin: 0; }
.demo h2 { font-size: 40px; line-height: 1.3; font-weight: 300; margin: 0; }
.demo p { max-width: 36em; }
</style>
</head>
<body>
<div class="demo">
<p>好的排版不会让你注意到它的存在。你只是觉得这篇文章读起来很顺，一口气就读完了。行长、行高、字号和标点，每一项都在悄悄影响阅读的节奏。宽屏上的正文如果不限宽，一行就会拉到五六十个字，读到行尾再回到下一行行首，眼睛要扫过大半个屏幕，很容易串行。</p>
</div>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>为什么年轻人又开始用纸质笔记本</title>
<style>
:where(:root:lang(zh)) { line-break: strict; }
:where(:lang(zh)) { font-synthesis-style: none; text-emphasis-position: under right; }
:where(:lang(zh)) :where(p, li) { line-height: 1.75; }
:where(:lang(zh)) :where(h1, h2, h3) { line-height: 1.3; }
.measure-prose { max-width: 36em; }
@supports (text-autospace: normal) { :where(:lang(zh)) { text-autospace: normal; } }
body { margin: 0; font-family: "Source Serif 4", "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif; font-size: 17px; color: #26221f; background: #faf7f2; }
main { margin: 0 auto; padding: 56px 24px; }
h1 { font-size: 34px; font-weight: 500; letter-spacing: 0.02em; }

</style>
</head>
<body>
<main class="measure-prose">
<h1>为什么年轻人又开始用纸质笔记本</h1>
<p class="lead">手机里的备忘录越来越多，可我们记住的事情好像越来越少。</p>
<h2>慢一点，反而记得住</h2>
<p>用笔写字比打字慢得多。正因为慢，你会在下笔之前先想一想，哪些话值得写下来。这个筛选的过程，本身就是一次整理。</p>
<p>有研究者让学生分别用电脑和纸笔记课堂笔记，结果发现，用纸笔的一组在<em>理解类问题</em>上的表现更好。</p>
<h2>一个本子，只做一件事</h2>
<p>很多人的做法是给每件事准备一个本子：读书一本，工作一本，日常琐事一本。翻开哪一本，就进入哪一种状态。</p>
<h2>它不会推送任何东西</h2>
<p>这可能是纸质笔记本最大的优点。它不会在你写到一半的时候弹出一条消息，也不会提醒你还有 99 条未读。</p>
</main>
</body>

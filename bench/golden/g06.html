<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在大理住了两周</title>
<style>
:where(:root:lang(zh)) { line-break: strict; }
:where(:lang(zh)) { font-synthesis-style: none; text-emphasis-position: under right; }
:where(:lang(zh)) :where(p, li) { line-height: 1.75; }
:where(:lang(zh)) :where(h1, h2, h3) { line-height: 1.3; }
.measure-prose { max-width: 36em; }
@supports (text-autospace: normal) { :where(:lang(zh)) { text-autospace: normal; } }
body { margin: 0; font-family: "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
<main style="max-width: 36em; margin: 0 auto; padding: 40px 20px;">
<h1 style="font-size: 30px; font-weight: 600; color: #1f2a2e;">在大理住了两周</h1>
<h2 style="font-size: 21px; margin-top: 36px; color: #1f2a2e;">住在古城外面</h2>
<p style="font-size: 16px; line-height: 1.8; color: #333;">我没有住在古城里，而是在才村找了一间能看到洱海的民宿。早上七点，湖面上会有一层很薄的雾。</p>
<h2 style="font-size: 21px; margin-top: 36px; color: #1f2a2e;">每天只安排一件事</h2>
<p style="font-size: 16px; line-height: 1.8; color: #333;">第一周我几乎没有计划，今天去喜洲吃破酥粑粑，明天沿着湖边骑车。慢下来之后，才发现原来一天可以这么长。</p>
<h2 style="font-size: 21px; margin-top: 36px; color: #1f2a2e;">离开前的清单</h2>
<ul><li style="font-size: 16px; line-height: 1.75;">在苍山脚下的小店买了一包手工扎染布。</li><li style="font-size: 16px; line-height: 1.75;">给明信片盖了三个邮戳，寄给半年后的自己。</li><li style="font-size: 16px; line-height: 1.75;">把房东推荐的那家米线店又吃了一次。</li></ul>
</main>
</body>
</html>
